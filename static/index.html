<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Kai — Personal AI Assistant</title>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-glass: #050505;
            --border-glass: rgba(0, 255, 0, 0.2);
            --primary: #00ff00;
            --primary-hover: #00cc00;
            --text-main: #00ff00;
            --text-muted: #008800;
            --accent: #00ff00;
            --danger: #ff0000;
            --success: #00ff00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.5;
            /* For iPhone 17 Edge to edge */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .app-container {
            width: 100%;
            height: 100%;
            background: var(--bg-glass);
            border: none;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0a0a0a;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: #000000;
            border: 1px solid var(--primary);
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--primary);
        }

        h1 {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .nav-tabs {
            display: flex;
            gap: 0.25rem;
            background: #000000;
            padding: 0.25rem;
            border-radius: 4px;
            border: 1px solid var(--border-glass);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--primary);
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .tab-btn.active {
            background: rgba(0, 255, 0, 0.1);
            color: var(--primary);
            box-shadow: inset 0 0 5px rgba(0, 255, 0, 0.3);
        }

        main {
            flex: 1;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .tab-content {
            display: none;
            padding: 1rem;
            flex: 1;
            animation: fadeIn 0.3s ease;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: bold;
            color: var(--primary);
            text-transform: uppercase;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: #000000;
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            color: var(--primary);
            padding: 0.75rem 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
            background: #050505;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button.primary-btn {
            background: #000000;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        button.primary-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        button.primary-btn:active {
            transform: scale(0.98);
        }

        /* Memories List */
        .memory-card {
            background: #0a0a0a;
            border: 1px solid var(--border-glass);
            border-left: 3px solid var(--primary);
            border-radius: 0;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: transform 0.2s ease;
        }

        .memory-card:hover {
            background: #111111;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .memory-content {
            flex: 1;
            padding-right: 1rem;
        }

        .memory-fact {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .memory-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* Login Screen */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: #050505;
            border: 1px solid var(--border-glass);
            border-top: 4px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
            display: none;
        }

        /* Chat UI */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 90%;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 0.75rem 1rem;
            border-radius: 0;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid var(--border-glass);
            word-break: break-word;
        }

        .message.user .message-bubble {
            background: rgba(0, 255, 0, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.2);
            border-bottom-right-radius: 12px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .message.bot .message-bubble {
            background: #000000;
            color: #eeeeee;
            border-color: var(--text-muted);
            border-bottom-left-radius: 12px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        .chat-input-area {
            padding: 1rem;
            background: #0a0a0a;
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 0.5rem;
        }

        .chat-input-area input {
            flex: 1;
        }

        .chat-input-area #send-btn {
            width: auto;
        }

        /* Loader */
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            top: env(safe-area-inset-top, 1rem);
            left: 50%;
            transform: translate(-50%, -100px);
            background: var(--primary);
            color: #000;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 9999;
            margin-top: 1rem;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .toast.error {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 0;
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="login-container" id="login-screen">
        <div class="brand-icon" style="margin: 0 auto 2rem auto; width: 64px; height: 64px; font-size: 2rem;">K</div>
        <h1 style="text-align: center; margin-bottom: 2rem;">KAI SYSTEM</h1>
        
        <form id="auth-form" onsubmit="handleAuth(event)">
            <input type="email" id="auth-email" placeholder="USER EMAIL" required style="margin-bottom: 1rem;">
            <input type="password" id="auth-password" placeholder="PASSWORD" required style="margin-bottom: 1rem;">
            
            <button type="submit" class="primary-btn" id="auth-submit-btn" style="width: 100%; margin-bottom: 1rem;">
                AUTHENTICATE
            </button>
        </form>
        
        <p style="text-align: center; color: var(--text-muted); cursor: pointer; text-decoration: underline;" onclick="toggleAuthMode()" id="auth-toggle-text">
            No account? Register here.
        </p>
        <p id="auth-error" style="color: var(--danger); text-align: center; margin-top: 1rem; display: none;"></p>
    </div>

    <div class="app-container" id="app-screen" style="display: none;">
        <header>
            <div class="brand">
                <div class="brand-icon">K</div>
                <h1>Kai <span style="color:var(--text-muted); font-size:0.875rem; font-weight:normal;">Assistant</span>
                </h1>
            </div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('chat')">Chat</button>
                <button class="tab-btn" onclick="switchTab('memory')">Memory</button>
                <button class="tab-btn" onclick="switchTab('profile')">Profile</button>
            </div>
        </header>

        <!-- CHAT TAB -->
        <main id="chat-tab" class="tab-content active" style="padding:0;">
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="message bot">
                        <div class="message-bubble">Hello! I'm Kai. You can tell me facts to remember or ask me
                            questions about what I know.</div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Message Kai..." onkeypress="handleKeyPress(event)">
                    <button class="primary-btn" id="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </main>

        <!-- MEMORY TAB -->
        <main id="memory-tab" class="tab-content">
            <h2 style="margin-bottom: 1.5rem;">Saved Memories</h2>
            <div id="memory-list">
                <!-- Memories populated via JS -->
                <div class="loader" style="border-top-color: var(--primary);"></div>
            </div>
        </main>

        <!-- PROFILE TAB -->
        <main id="profile-tab" class="tab-content">
            <h2 style="margin-bottom: 1.5rem;">User Profile</h2>
            <div class="form-group">
                <label for="profile-name">Your Name</label>
                <input type="text" id="profile-name" placeholder="E.g. User">
            </div>
            <div class="form-group">
                <label for="profile-instructions">Custom Instructions / Context</label>
                <textarea id="profile-instructions"
                    placeholder="E.g. I am a software engineer. I prefer very short, factual answers without conversational filler."></textarea>
                <p style="font-size:0.75rem; color:var(--text-muted); margin-top:0.5rem;">Kai reads this context before
                    answering any of your questions.</p>
            </div>
            <button class="primary-btn" onclick="saveProfile()" id="save-profile-btn">Save Profile</button>
        </main>
    </div>

    <div class="toast" id="toast">Saved successfully!</div>

    <script>
        // Secret token mapping
        let SECRET_TOKEN = localStorage.getItem('kai_token');
        let isLoginMode = true;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-submit-btn').innerText = isLoginMode ? 'AUTHENTICATE' : 'INITIALIZE NEW USER';
            document.getElementById('auth-toggle-text').innerText = isLoginMode ? 'No account? Register here.' : 'Already have access? Login here.';
            document.getElementById('auth-error').style.display = 'none';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
            const errorEl = document.getElementById('auth-error');
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    errorEl.innerText = data.detail || 'Authentication failed.';
                    errorEl.style.display = 'block';
                } else {
                    localStorage.setItem('kai_token', data.token);
                    SECRET_TOKEN = data.token;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    loadProfile();
                }
            } catch (err) {
                errorEl.innerText = 'Network error.';
                errorEl.style.display = 'block';
            }
        }

        if (!SECRET_TOKEN) {
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('app-screen').style.display = 'none';
        } else {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            loadProfile();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`${tabId}-tab`).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'memory') loadMemories();
            if (tabId === 'profile') loadProfile();
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast show ${isError ? 'error' : ''}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- Profile ---
        function logout() {
            localStorage.removeItem('kai_token');
            SECRET_TOKEN = null;
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('app-screen').style.display = 'none';
        }

        async function loadProfile() {
            if (!SECRET_TOKEN) return;
            try {
                const res = await fetch('/api/profile', {
                    headers: { 'Authorization': `Bearer ${SECRET_TOKEN}` }
                });
                if (res.status === 401) return logout();
                const data = await res.json();
                document.getElementById('profile-name').value = data.name || '';
                document.getElementById('profile-instructions').value = data.instructions || '';
            } catch (e) {
                console.error(e);
            }
        }

        async function saveProfile() {
            if (!SECRET_TOKEN) return;
            const btn = document.getElementById('save-profile-btn');
            btn.innerHTML = '<div class="loader"></div> Saving...';

            const name = document.getElementById('profile-name').value;
            const instructions = document.getElementById('profile-instructions').value;

            try {
                const res = await fetch('/api/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SECRET_TOKEN}`
                    },
                    body: JSON.stringify({ name, instructions })
                });
                if (res.status === 401) return logout();
                showToast("Profile saved!");
            } catch (e) {
                showToast("Error saving profile", true);
            } finally {
                btn.innerHTML = 'Save Profile';
            }
        }

        // --- Memory ---
        function formatDate(isoStr) {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function loadMemories() {
            if (!SECRET_TOKEN) return;
            const list = document.getElementById('memory-list');
            list.innerHTML = '<div style="text-align:center; padding: 2rem;"><div class="loader" style="border-top-color: var(--primary);"></div></div>';

            try {
                const res = await fetch('/api/memories', {
                    headers: { 'Authorization': `Bearer ${SECRET_TOKEN}` }
                });
                if (res.status === 401) return logout();
                const memories = await res.json();

                if (memories.length === 0) {
                    list.innerHTML = '<div class="empty-state">No memories saved yet. Tell Kai something to remember!</div>';
                    return;
                }

                list.innerHTML = memories.map(m => `
                    <div class="memory-card" id="mem-${m.id}">
                        <div class="memory-content">
                            <div class="memory-fact">${escapeHtml(m.fact)}</div>
                            <div class="memory-meta">
                                <span>${formatDate(m.timestamp)}</span>
                                <span>Source: ${escapeHtml(m.source)}</span>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteMemory('${m.id}')" title="Delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = '<div class="empty-state" style="color:var(--danger)">Error loading memories.</div>';
            }
        }

        async function deleteMemory(id) {
            if (!confirm("Delete this memory forever?")) return;
            try {
                const res = await fetch(`/api/memories/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${SECRET_TOKEN}` }
                });
                if (res.status === 401) return logout();
                document.getElementById(`mem-${id}`).remove();
                showToast("Memory deleted");
            } catch (e) {
                showToast("Failed to delete", true);
            }
        }

        // --- Chat ---
        function escapeHtml(unsafe) {
            return (unsafe || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function appendMessage(text, isUser = false) {
            const chat = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'bot'}`;
            msg.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            return msg;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            if (!SECRET_TOKEN) return logout();

            input.value = '';
            appendMessage(text, true);

            const btn = document.getElementById('send-btn');
            btn.innerHTML = '<div class="loader"></div>';
            btn.disabled = true;

            try {
                const res = await fetch('/webhook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SECRET_TOKEN}`
                    },
                    body: JSON.stringify({ text, source: 'web' })
                });

                if (res.status === 401) return logout();

                const data = await res.json();
                if (res.ok) {
                    appendMessage(data.message, false);
                } else {
                    appendMessage(`Error: ${data.message || data.error || 'Unknown error'}`, false);
                }
            } catch (e) {
                appendMessage(`Connection error.`, false);
            } finally {
                btn.innerHTML = 'Send';
                btn.disabled = false;
                input.focus();
            }
        }

        // Initialize
        if (SECRET_TOKEN) {
            loadProfile();
        }
    </script>
</body>

</html>
